<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Municipal FAQ Demo</title>
<style>
  body { max-width: 680px; margin: 2rem auto; padding-inline: 1rem; font: 17px/1.6 system-ui; background: #122030; color: #eef5f9; }
  input, button { font: inherit; } input { max-width: 100%; width: 320px; }
  output { display: block; margin-top: 1rem; }
</style>
<main>
  <h1>Municipal FAQ Demo</h1>
  <p>Try “When are you open?” or “When is recycling pickup?”</p>
  <form>
    <label>Question <input id="message" required maxlength="500"></label>
    <button>Send</button>
  </form>
  <output aria-live="polite"></output>
</main>
<script type="module">
const form = document.querySelector("form");
const output = document.querySelector("output");
form.addEventListener("submit", async event => {
  event.preventDefault();
  try {
    const message = document.getElementById("message").value;
    const response = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message})
    });
    if (!response.ok) throw new Error("The request could not be processed.");
    const result = await response.json();
    output.value = "[" + result.route + "] " + result.answer;
  } catch (error) {
    output.value = error.message;
  }
});
</script>
</html>
