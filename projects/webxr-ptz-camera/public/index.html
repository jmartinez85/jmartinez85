<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTZ Camera Simulator</title>
<style>
  body { margin: 2rem auto; max-width: 700px; padding-inline: 1rem; font: 17px/1.6 system-ui, sans-serif; background: #122030; color: #eef5f9; }
  button { font: inherit; margin: .2rem; } output, canvas { display: block; margin-top: 1rem; }
  canvas { width: 100%; border: 1px solid #66849c; }
</style>
<main>
  <h1>PTZ Camera Simulator</h1>
  <p>Move the simulated view with the camera controls.</p>
  <div id="controls">
    <button data-action="left">Left</button><button data-action="right">Right</button>
    <button data-action="up">Up</button><button data-action="down">Down</button>
    <button data-action="zoom-in">Zoom in</button><button data-action="zoom-out">Zoom out</button>
    <button data-action="home">Home</button>
  </div>
  <output aria-live="polite">Loading camera…</output>
  <canvas width="640" height="220" aria-label="Illustrative camera frame"></canvas>
</main>
<script type="module" src="/main.js"></script>
</html>
